<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HolsterBase Admin</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#101828}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.back{color:#175cd3;text-decoration:none;font-weight:700}h1{margin:0 0 6px}.muted{color:#667085}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 8px 24px rgba(16,24,40,.05)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px}.search{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}.chip.active{background:#101828;color:#fff;border-color:#101828}.stats{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0;color:#475467}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;border:1px solid #e4e7ec;border-radius:14px;padding:14px}.name{font-weight:800}.sub{font-size:13px;color:#667085;margin-top:3px}.toggle{display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}.toggle input{width:20px;height:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:#101828;color:#fff}.btn.secondary{background:#eef2f6;color:#101828}.output{display:none;margin-top:16px}.output.show{display:block}textarea{width:100%;min-height:300px;border:1px solid #d0d5dd;border-radius:12px;padding:14px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}.status{margin-top:10px;font-size:14px;color:#067647}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.empty{padding:28px;text-align:center;color:#667085}@media(max-width:700px){.wrap{padding:14px}.toolbar{grid-template-columns:1fr}.item{grid-template-columns:1fr}.toggle{justify-content:space-between}.actions .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>HolsterBase Admin</h1><div class="muted">Редактор ассортимента и рекомендаций</div></div><a class="back" href="index.html">← Каталог</a></div>
  <div class="panel">
    <div class="toolbar"><input id="search" class="search" placeholder="Поиск модели или производителя"><button id="reload" class="btn secondary">Обновить список</button></div>
    <div class="filters"><button class="chip active" data-filter="all">Все</button><button class="chip" data-filter="available">Наш ассортимент</button><button class="chip" data-filter="recommended">Рекомендуемые</button><button class="chip" data-filter="empty">Неотмеченные</button></div>
    <div class="stats"><span>Всего: <b id="total">0</b></span><span>В ассортименте: <b id="availableCount">0</b></span><span>Рекомендуем: <b id="recommendedCount">0</b></span></div>
    <div id="list" class="list"><div class="empty">Загрузка каталога…</div></div>
    <div class="actions"><button id="generate" class="btn">Сформировать catalog-status.json</button><button id="github" class="btn secondary">Открыть файл на GitHub</button></div>
    <div id="output" class="output"><textarea id="json" readonly></textarea><div class="actions"><button id="copy" class="btn">Копировать JSON</button></div><div id="status" class="status"></div></div>
  </div>
</div>
<iframe id="catalog" src="index.html"></iframe>
<script>
const GH='https://github.com/s1koice/holsterbase/edit/main/catalog-status.json';
let models=[], state={}, filter='all';
const slug=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9а-яё]+/gi,'-').replace(/^-+|-+$/g,'');
function titleFromCard(card){
  const preferred=card.querySelector('[data-model],h1,h2,h3,h4,.title,.model,.card-title,strong');
  if(preferred){const t=preferred.getAttribute('data-model')||preferred.textContent.trim();if(t&&t.length<160)return t;}
  const lines=card.innerText.split('\n').map(x=>x.trim()).filter(Boolean);return lines[0]||'';
}
function extractModels(doc){
  const selectors=['[data-model]','.product-card','.holster-card','.card','.item','.catalog-item','article'];
  let cards=[];for(const s of selectors){cards=[...doc.querySelectorAll(s)];if(cards.length>3)break;}
  const seen=new Set(), out=[];
  cards.forEach(card=>{const name=titleFromCard(card);if(!name||name.length<2)return;const id=card.getAttribute('data-model-id')||card.getAttribute('data-id')||slug(name);if(!id||seen.has(id))return;seen.add(id);const text=card.innerText.replace(/\s+/g,' ').trim();out.push({id,name,details:text.slice(name.length).trim().slice(0,180)});});
  return out.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}
async function loadState(){try{const r=await fetch('catalog-status.json?'+Date.now());state=r.ok?await r.json():{};}catch{state={};}}
async function loadCatalog(){
  document.getElementById('list').innerHTML='<div class="empty">Загрузка каталога…</div>';
  await loadState();const frame=document.getElementById('catalog');
  const read=()=>{try{models=extractModels(frame.contentDocument);render();}catch(e){document.getElementById('list').innerHTML='<div class="empty">Не удалось прочитать каталог: '+e.message+'</div>';}};
  if(frame.contentDocument&&frame.contentDocument.readyState==='complete')setTimeout(read,900);else frame.onload=()=>setTimeout(read,900);
}
function render(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const rows=models.filter(m=>{const s=state[m.id]||{};if(q&&!(`${m.name} ${m.details}`.toLowerCase().includes(q)))return false;if(filter==='available'&&!s.available)return false;if(filter==='recommended'&&!s.recommended)return false;if(filter==='empty'&&(s.available||s.recommended))return false;return true;});
  document.getElementById('total').textContent=models.length;
  document.getElementById('availableCount').textContent=models.filter(m=>state[m.id]?.available).length;
  document.getElementById('recommendedCount').textContent=models.filter(m=>state[m.id]?.recommended).length;
  const list=document.getElementById('list');list.innerHTML='';
  if(!rows.length){list.innerHTML='<div class="empty">Ничего не найдено</div>';return;}
  rows.forEach(m=>{const s=state[m.id]||{};const el=document.createElement('div');el.className='item';el.innerHTML=`<div><div class="name">${escapeHtml(m.name)}</div><div class="sub">${escapeHtml(m.details||m.id)}</div></div><label class="toggle">Есть в ассортименте <input type="checkbox" data-kind="available" ${s.available?'checked':''}></label><label class="toggle">Рекомендуем <input type="checkbox" data-kind="recommended" ${s.recommended?'checked':''}></label>`;el.querySelectorAll('input').forEach(input=>input.onchange=()=>{state[m.id]={available:el.querySelector('[data-kind=available]').checked,recommended:el.querySelector('[data-kind=recommended]').checked};if(!state[m.id].available&&!state[m.id].recommended)delete state[m.id];render();});list.appendChild(el);});
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function output(){const clean={};Object.keys(state).sort().forEach(id=>{const s=state[id];if(s.available||s.recommended)clean[id]={available:!!s.available,recommended:!!s.recommended};});const text=JSON.stringify(clean,null,2)+'\n';document.getElementById('json').value=text;document.getElementById('output').classList.add('show');document.getElementById('status').textContent='';document.getElementById('output').scrollIntoView({behavior:'smooth'});}
document.getElementById('search').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render();});document.getElementById('generate').onclick=output;document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('json').value);document.getElementById('status').textContent='JSON скопирован. Вставь его в catalog-status.json на GitHub.';};document.getElementById('github').onclick=()=>window.open(GH,'_blank');document.getElementById('reload').onclick=()=>{document.getElementById('catalog').src='index.html?'+Date.now();loadCatalog();};loadCatalog();
</script>
</body>
</html>
