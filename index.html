<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HolsterBase</title>
<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#101828;color:#fff;display:grid;place-items:center;min-height:100vh}main{text-align:center;padding:24px}.logo{width:64px;height:64px;border-radius:18px;background:#1e5eff;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 18px}.muted{color:#b7c0ce}</style>
</head>
<body>
<main><div class="logo">HB</div><h1>HolsterBase</h1><p class="muted">Загрузка каталога Fobus и Orpaz…</p></main>
<script src="site-chunk-0.js"></script>
<script src="site-chunk-1.js"></script>
<script>
(async()=>{
  try{
    const bytes=Uint8Array.from(atob(window.__HB_SITE),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    html=html.replace('</style>',`.modal[hidden]{display:none!important}
.carry-code{display:inline-flex;flex-direction:column;gap:1px;line-height:1.15}.carry-code small{font-size:10px;font-weight:600;opacity:.78;white-space:nowrap}.detail-box .carry-code small{font-size:11px;color:#667085}.carry-help{font-size:12px;color:#667085;margin-top:5px}
.hb-status{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}.hb-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.hb-badge.available{background:#ecfdf3;color:#067647;border:1px solid #abefc6}.hb-badge.recommended{background:#fffaeb;color:#b54708;border:1px solid #fedf89}.hb-admin-link{position:fixed;right:14px;bottom:14px;z-index:9999;background:#101828;color:#fff!important;text-decoration:none;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:800;box-shadow:0 8px 22px rgba(16,24,40,.25)}</style>`);
    html=html.replace('</body>',`<script>
(function(){
  const labels={
    'IWB':'Внутренняя — внутри пояса',
    'OWB':'Наружная — снаружи пояса',
    'IWB / OWB':'Внутренняя / наружная',
    'OWB / IWB':'Наружная / внутренняя',
    'OWB tactical':'Наружная тактическая',
    'OWB rotating':'Наружная поворотная',
    'OWB modular':'Наружная модульная',
    'IWB / OWB adapter':'Внутренняя / наружная с адаптером',
    'Duty':'Служебная',
    'Duty / OWB':'Служебная / наружная',
    'Ankle':'На лодыжке',
    'Shoulder':'Плечевая',
    'Chest':'Нагрудная',
    'Drop Leg':'Набедренная',
    'Tactical':'Тактическая'
  };
  function describe(value){
    if(labels[value]) return labels[value];
    if(value.includes('IWB')&&value.includes('OWB')) return 'Внутренняя / наружная';
    if(value.includes('IWB')) return 'Внутренняя — внутри пояса';
    if(value.includes('OWB')) return 'Наружная — снаружи пояса';
    if(value.toLowerCase().includes('duty')) return 'Служебная';
    if(value.toLowerCase().includes('ankle')) return 'На лодыжке';
    return '';
  }
  function decorate(root=document){
    root.querySelectorAll('.tag').forEach(el=>{
      if(el.dataset.carryDone) return;
      const raw=el.textContent.trim(); const text=describe(raw);
      if(text){el.dataset.carryDone='1';el.classList.add('carry-code');el.innerHTML='<span>'+raw+'</span><small>'+text+'</small>';}
    });
    root.querySelectorAll('.detail-box strong').forEach(el=>{
      if(el.dataset.carryDone) return;
      const raw=el.textContent.trim(); const text=describe(raw);
      if(text){el.dataset.carryDone='1';el.classList.add('carry-code');el.innerHTML='<span>'+raw+'</span><small>'+text+'</small>';}
    });
    const carry=document.getElementById('carry');
    if(carry&&!carry.dataset.described){
      carry.dataset.described='1';
      [...carry.options].forEach(o=>{const d=describe(o.value);if(d&&o.value)o.textContent=o.value+' — '+d;});
    }
  }
  const observer=new MutationObserver(()=>decorate());
  observer.observe(document.documentElement,{childList:true,subtree:true});
  decorate();
})();
<\/script>
<script>
(function(){
  const slug=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9а-яё]+/gi,'-').replace(/^-+|-+$/g,'');
  let status={};
  function cardTitle(card){
    const el=card.querySelector('[data-model],h1,h2,h3,h4,.title,.model,.card-title,strong');
    if(el){const t=el.getAttribute('data-model')||el.textContent.trim();if(t&&t.length<160)return t;}
    const lines=card.innerText.split('\\n').map(x=>x.trim()).filter(Boolean);return lines[0]||'';
  }
  function findCards(){
    const selectors=['[data-model]','.product-card','.holster-card','.card','.catalog-item','article'];
    for(const s of selectors){const list=[...document.querySelectorAll(s)];if(list.length>3)return list;}
    return [];
  }
  function decorateStatus(){
    findCards().forEach(card=>{
      const name=cardTitle(card);if(!name)return;
      const id=card.getAttribute('data-model-id')||card.getAttribute('data-id')||slug(name);
      const s=status[id];
      const old=card.querySelector('.hb-status');if(old)old.remove();
      if(!s||(!s.available&&!s.recommended))return;
      const box=document.createElement('div');box.className='hb-status';
      if(s.available){const b=document.createElement('span');b.className='hb-badge available';b.textContent='● Есть в ассортименте';box.appendChild(b);}
      if(s.recommended){const b=document.createElement('span');b.className='hb-badge recommended';b.textContent='★ Рекомендуем';box.appendChild(b);}
      const anchor=card.querySelector('[data-model],h1,h2,h3,h4,.title,.model,.card-title,strong');
      if(anchor&&anchor.parentNode)anchor.insertAdjacentElement('afterend',box);else card.prepend(box);
    });
  }
  async function init(){
    try{const r=await fetch('catalog-status.json?'+Date.now());if(r.ok)status=await r.json();}catch(e){}
    decorateStatus();
    const observer=new MutationObserver(()=>decorateStatus());observer.observe(document.documentElement,{childList:true,subtree:true});
    if(!document.querySelector('.hb-admin-link')){const a=document.createElement('a');a.className='hb-admin-link';a.href='admin.html';a.textContent='Редактор ассортимента';document.body.appendChild(a);}
  }
  init();
})();
<\/script></body>`);
    html=html.replace('<script>const CATALOG_DATA=', '<script src="search.js?v=20260926-2"><\/script><script>const CATALOG_DATA=');
    html=html.replace("if(q)rows=rows.filter(h=>[h.code,h.name,h.description,h.brand,...h.fits.flatMap(x=>[x.brand,x.model])].join(' ').toLowerCase().includes(q));", "if(q)rows=HBSearch.search(rows,q);");
    html=html.replace("  rows.sort((a,b)=>", "  if(!q)rows.sort((a,b)=>");
    html=html.replace('</body>', '<script src="catalog-search-ui.js?v=20260926-2"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){document.querySelector('.muted').textContent='Ошибка загрузки каталога: '+e.message;}
})();
</script>
</body>
</html>
